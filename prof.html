<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prof vocal</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.29/dist/bundle.min.js"></script>
<style>
:root{--bg:#f6f5f1;--card:#fff;--fg:#1f1e1c;--muted:#6d6b65;--line:#e2e0d8;--acc:#185FA5;--listen:#1D9E75;--think:#BA7517;--speak:#185FA5;--red:#E24B4A}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1a;--card:#262624;--fg:#ecebe6;--muted:#a3a19a;--line:#3a3936;--acc:#85B7EB;--listen:#5DCAA5;--think:#EF9F27;--speak:#85B7EB}}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
#board{flex:1;border:0;width:100%;min-height:0;background:var(--bg)}
#bar{border-top:1px solid var(--line);display:grid;grid-template-columns:230px minmax(0,1fr) auto;gap:14px;padding:8px 14px;align-items:start;max-height:30vh}
#st{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:500;padding-top:2px}
#dot{width:14px;height:14px;border-radius:50%;background:var(--muted);flex:none;transition:transform .1s}
#dot.listening{background:var(--listen)} #dot.thinking,#dot.transcribing{background:var(--think);animation:pulse 1s infinite}
#dot.speaking{background:var(--speak)} #dot.recording{background:var(--red);animation:pulse .8s infinite}
body.rec #bar{background:color-mix(in srgb,var(--red) 14%,transparent)} body.rec #stt{color:var(--red)} #dot.off{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}
#sub{color:var(--muted);font-size:13px;margin-top:2px}
#log{overflow:auto;max-height:calc(30vh - 16px);font-size:14px}
#log .u{color:var(--fg);font-weight:500;margin-top:6px} #log .u::before{content:"Toi : ";color:var(--muted);font-weight:400}
#log .p{color:var(--fg)} #log .p::before{content:"Prof : ";color:var(--muted)}
#log .p .s.cur{background:color-mix(in srgb,var(--speak) 22%,transparent);border-radius:4px}
#log .p .s.cut{text-decoration:line-through;color:var(--muted)}
#log .tool{color:var(--muted);font-size:12px;font-style:italic}
#side{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
button{font:inherit;font-size:14px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer}
button.big{font-size:18px;padding:10px 22px;background:var(--acc);color:#fff;border:0}
#txt{font:inherit;font-size:13px;width:220px;padding:4px 8px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--fg)}
#lat{color:var(--muted);font-size:12px}
#meter{width:120px;height:5px;background:var(--line);border-radius:3px;overflow:hidden}#meter i{display:block;height:100%;width:0;background:var(--listen)}
#log .err{color:var(--red);font-size:13px}
#micinfo{color:var(--muted);font-size:12px;max-width:260px;text-align:right}
#settings{display:none;position:fixed;right:14px;bottom:calc(30vh + 8px);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;z-index:8;flex-direction:column;gap:10px;width:340px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#settings.open{display:flex} #settings label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
#settings label.row{flex-direction:row;align-items:center;gap:6px}
#settings select{font:inherit;font-size:14px;padding:4px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
#cover2{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:color-mix(in srgb,var(--bg) 92%,transparent);z-index:10;text-align:center}
#cover{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:color-mix(in srgb,var(--bg) 85%,transparent);z-index:9}
#cover p{color:var(--muted);max-width:520px;text-align:center}
</style>
</head>
<body>
<iframe id="board"></iframe>
<div id="bar">
  <div><div id="st"><span id="dot"></span><span id="stt">connexion…</span></div><div id="sub"></div><div id="meter"><i></i></div></div>
  <div id="log"></div>
  <div id="side">
    <div style="display:flex;gap:6px"><button id="mode" title="espace : appui = j'enregistre, 2e appui = j'envoie ; auto : détection de fin de phrase">Mode : espace</button>
    <button id="send" title="Espace">Parler / Envoyer</button></div>
    <button id="mute" title="Couper / rouvrir le micro">Micro : ouvert</button>
    <input id="txt" placeholder="ou écris ta question + Entrée">
    <div style="display:flex;gap:6px"><button id="test" title="Envoie un wav enregistré comme si tu avais parlé">Question test (wav)</button>
    <button id="gear" title="Micro, voix, vitesse">⚙ Réglages</button></div>
    <span id="micinfo"></span>
    <span id="lat"></span>
  </div>
</div>
<div id="settings">
  <label>Micro <select id="micsel"><option>(après « Démarrer »)</option></select></label>
  <label class="row"><input type="checkbox" id="filters" checked> filtres du navigateur (écho, bruit, gain)</label>
  <label>Voix <select id="voicesel"></select></label>
  <label>Vitesse <input type="range" id="speed" min="0.7" max="1.4" step="0.05" value="1"> <span id="speedv">× 1.00</span></label>
  <button id="sample">Écouter un exemple</button>
</div>
<div id="cover"><button class="big" id="go">Démarrer le cours</button>
  <p>Un clic est nécessaire pour autoriser le micro et le son.<br><b>Espace</b> : un appui = j'enregistre (et le prof se tait), un 2e appui = j'envoie. Échap annule.<br>Le mode « auto » détecte seul la fin de tes phrases (moins fiable avec du bruit).</p></div>
<script>
const $ = id => document.getElementById(id);
let ws, gen = 0, mic = null, muted = false, micErr = "";
const LABEL = {recording: "● j'enregistre", listening: "j'écoute", transcribing: "je transcris…", thinking: "je réfléchis…", speaking: "je parle", off: "déconnecté"};
let serverState = "listening";

// ---------- lecture audio en file ----------
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const out = ctx.createGain(); out.gain.value = new URLSearchParams(location.search).has("mute") ? 0 : 1; out.connect(ctx.destination);  // ?mute : tests automatiques sans son
let queue = [], cur = null, playing = false, ducked = false;
let tSpeechEnd = null, vadWait = 0;      // pour mesurer fin de parole -> 1er son
function pcmBuffer(b64, sr) {
  const bin = atob(b64), n = bin.length >> 1, buf = ctx.createBuffer(1, n, sr), ch = buf.getChannelData(0);
  const dv = new DataView(new ArrayBuffer(bin.length)); for (let i = 0; i < bin.length; i++) dv.setUint8(i, bin.charCodeAt(i));
  for (let i = 0; i < n; i++) ch[i] = dv.getInt16(2 * i, true) / 32768;
  return buf;
}
function playNext() {
  if (playing || ducked) return;
  const it = queue.shift();
  if (!it) { cur = null; if (serverState === "listening" || serverState === "done") show("listening"); return; }
  const src = ctx.createBufferSource(); src.buffer = it.buf; src.connect(out);
  cur = {...it, src}; playing = true;
  markCur(it);
  src.onended = () => { if (cur && cur.src === src) { playing = false; cur.el && cur.el.classList.remove("cur"); cur = null; playNext(); } };
  src.start();
  show("speaking");
  if (tSpeechEnd !== null && it.idx === 0) {
    const ms = performance.now() - tSpeechEnd + vadWait;
    $("lat").dataset.l = `fin de parole → 1er son : ${(ms / 1000).toFixed(2)} s`; renderLat();
    send({t: "latency", ms, vad_ms: vadWait}); tSpeechEnd = null;
  }
}
function stopAll(mark) {
  const last = cur ? cur.text : (queue[0] ? "" : "");
  if (cur) { cur.src.onended = null; try { cur.src.stop(); } catch (e) {} if (mark && cur.el) { cur.el.classList.remove("cur"); cur.el.classList.add("cut"); } }
  queue = []; cur = null; playing = false;
  return last;
}
const busy = () => playing || queue.length > 0 || serverState === "thinking" || serverState === "transcribing";

// ---------- affichage ----------
let pLine = null;
function show(s, detail) {
  $("dot").className = s === "done" ? "listening" : s;
  $("stt").textContent = LABEL[s] || s;
  if (detail !== undefined) $("sub").textContent = detail;
  if (s === "listening") $("sub").textContent = micErr || (muted ? "micro coupé" : mode === "espace" ? "espace pour parler" : "parle quand tu veux");
  document.body.classList.toggle("rec", s === "recording");
}
function addLine(cls, text) {
  const d = document.createElement("div"); d.className = cls; d.textContent = text; $("log").append(d);
  $("log").scrollTop = 1e9; return d;
}
function markCur(it) {
  if (!it.el) return; it.el.classList.add("cur"); $("log").scrollTop = 1e9;
}
function proseSpan(text) {
  if (!pLine) pLine = addLine("p", "");
  const s = document.createElement("span"); s.className = "s"; s.textContent = text + " "; pLine.append(s);
  $("log").scrollTop = 1e9; return s;
}

// ---------- websocket ----------
let replaced = false;
function replacedCover() {
  stopAll(false); if (recording) stopRec(false); if (mic) mic.pause();
  show("off", "page ouverte ailleurs");
  if ($("cover2")) return;
  const c = document.createElement("div"); c.id = "cover2"; c.className = "cover";
  c.innerHTML = `<p><b>Le Prof est ouvert dans un autre onglet.</b><br>Une seule page peut être active à la fois.</p><button class="big">Reprendre ici</button>`;
  c.querySelector("button").onclick = () => location.reload();
  document.body.append(c);
}
// toute erreur JS est affichée dans la barre (et pas seulement dans la console)
function showErr(msg) {
  console.error(msg); const d = addLine("err", "⚠ " + msg); pLine = null;
  $("sub").textContent = "⚠ erreur : " + String(msg).slice(0, 120);
}
window.addEventListener("error", e => showErr(e.message + (e.lineno ? ` (ligne ${e.lineno})` : "")));
window.addEventListener("unhandledrejection", e => showErr((e.reason && (e.reason.message || e.reason)) || "promesse rejetée"));
function send(o) {
  if (!ws || ws.readyState !== 1) { showErr("pas connecté au serveur : message non envoyé"); return; }
  ws.send(typeof o === "string" || o instanceof ArrayBuffer ? o : JSON.stringify(o)); }
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws?v=2`); ws.binaryType = "arraybuffer";
  ws.onopen = () => show("listening");
  ws.onclose = e => {
    if (e.code === 4001 || replaced) { replacedCover(); return; }   // une autre page a pris la main : pas de reconnexion
    show("off"); setTimeout(connect, 1500);
  };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.t === "replaced") { replaced = true; replacedCover(); return; }
    if (m.t === "voice") { fillVoices(null, m.voice); return; }
    if (m.t === "sample") { playSample(m); return; }
    if (m.t === "info") {
      fillVoices(m.voices, m.voice);
      if (!$("board").src) $("board").src = `http://localhost:8777/s/${m.slug}`;
      document.title = `Prof · ${m.topic}`;
      $("log").innerHTML = ""; pLine = null;
      for (const [who, t] of m.history) who === "élève" ? (addLine("u", t), pLine = null) : proseSpan(t);
    } else if (m.t === "state") {
      serverState = m.s;
      if (!(playing && m.s === "listening") && !recording && !speaking) show(m.s);
    } else if (m.t === "gen") {
      gen = m.gen; pLine = null;
    } else if (m.t === "user") {
      addLine("u", m.text); pLine = null;
    } else if (m.t === "say") {
      if (m.gen !== gen) return;
      const el = proseSpan(m.text);
      queue.push({gen: m.gen, idx: m.idx, text: m.text, el, buf: pcmBuffer(m.pcm, m.sr)});
      playNext();
    } else if (m.t === "tool") {
      addLine("tool", m.text); pLine = null;
      if (!playing) show("thinking", m.text);
    } else if (m.t === "done") {
      if (m.gen === gen) { serverState = "done"; if (!playing && !queue.length) show("listening"); }
    }
  };
}

// ---------- micro ----------
// Deux modes : « espace » (défaut : un appui commence l'enregistrement, un 2e appui l'envoie ; fiable même avec du bruit)
// et « auto » (VAD Silero : la fin de phrase est détectée toute seule).
const REDEMPTION_MS = 550, MAX_AUTO_S = 20, MAX_SPACE_S = 60;
let mode = "espace", stream = null, rec = null, recording = false, chunks = [], recT0 = 0, recTimer = null, autoTimer = null;
try { mode = localStorage.getItem("prof-mode") || "espace"; } catch (e) {}
let noise = {sum: 0, n: 0}, speaking = false;
const dbg = (...a) => console.log(`[prof ${(performance.now() / 1000).toFixed(1)}s]`, ...a);

function bargeIn() {
  if (!busy()) return;
  const last = cur ? cur.text : "";
  stopAll(true); ducked = false; ctx.resume();
  gen = -1;                                          // ignore l'audio encore en vol
  send({t: "barge", last}); dbg("barge-in, dernière phrase :", last);
  addLine("tool", "(interrompu)"); pLine = null;
}
function sendSegment(f32, why, sr = 16000) {
  const sec = f32.length / sr;
  if (sec < 0.3) { dbg("segment trop court, ignoré", sec); show("listening"); return; }
  if (!ws || ws.readyState !== 1) { dbg("segment PERDU : websocket fermée", ws && ws.readyState); show("listening", "segment perdu : connexion au serveur coupée"); return; }
  ws.send(JSON.stringify({t: "audio", sr, mic: micLabel()}));   // annonce le taux du segment qui suit
  ws.send(f32.buffer.slice(f32.byteOffset, f32.byteOffset + f32.byteLength));
  dbg(`segment envoyé (${why}) : ${sec.toFixed(1)} s à ${sr} Hz`);
  show("transcribing", `envoyé : ${sec.toFixed(1)} s d'audio`);
}

// --- mode espace : enregistrement au taux natif du micro (AudioWorklet), rééchantillonné côté serveur ---
// (l'ancien AudioContext à 16 kHz + ScriptProcessor laissait passer des trous et un rééchantillonnage douteux)
const CAP_WORKLET = `class Cap extends AudioWorkletProcessor {
  constructor() { super(); this.buf = new Float32Array(2048); this.n = 0; }
  process(inputs) {
    const x = inputs[0] && inputs[0][0]; if (!x) return true;
    for (let i = 0; i < x.length; i++) { this.buf[this.n++] = x[i]; if (this.n === this.buf.length) { this.port.postMessage(this.buf); this.buf = new Float32Array(2048); this.n = 0; } }
    return true;
  }
}
registerProcessor("cap", Cap);`;
let capNode = null, capSrc = null;
async function startRecorder() {
  rec = new AudioContext();                            // taux natif (souvent 48 kHz)
  await rec.audioWorklet.addModule(URL.createObjectURL(new Blob([CAP_WORKLET], {type: "application/javascript"})));
  capNode = new AudioWorkletNode(rec, "cap");
  const sink = rec.createGain(); sink.gain.value = 0;
  capNode.port.onmessage = e => {
    const x = e.data;
    if (recording) chunks.push(x);
    if (mode === "espace") {
      let r = 0; for (let i = 0; i < x.length; i++) r += x[i] * x[i];
      $("meter").firstChild.style.width = Math.min(100, Math.round(Math.sqrt(r / x.length) * 600)) + "%";
    }
  };
  capNode.connect(sink); sink.connect(rec.destination);
  connectRecorder();
}
function connectRecorder() {
  if (capSrc) capSrc.disconnect();
  capSrc = rec.createMediaStreamSource(stream); capSrc.connect(capNode);
}
function startRec() {
  if (recording) return;
  bargeIn();
  if (rec.state !== "running") rec.resume();
  recording = true; chunks = []; recT0 = performance.now();
  show("recording");
  recTimer = setInterval(() => {
    const t = (performance.now() - recT0) / 1000;
    $("sub").textContent = `${t.toFixed(0)} s — espace pour envoyer, Échap pour annuler`;
    if (t > MAX_SPACE_S) stopRec(true);
  }, 250);
}
function stopRec(sendIt) {
  if (!recording) return;
  recording = false; clearInterval(recTimer);
  const n = chunks.reduce((a, c) => a + c.length, 0), f = new Float32Array(n);
  let o = 0; for (const c of chunks) { f.set(c, o); o += c.length; }
  chunks = [];
  if (!sendIt) { dbg("enregistrement annulé"); show("listening"); return; }
  tSpeechEnd = performance.now(); vadWait = 0;
  sendSegment(f, "espace", rec.sampleRate);
}

// --- mode auto : VAD ---
async function startVad() {
  mic = await vad.MicVAD.new({
    model: "v5",
    baseAssetPath: "https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.29/dist/",
    onnxWASMBasePath: "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/",
    positiveSpeechThreshold: 0.6, negativeSpeechThreshold: 0.45,
    redemptionMs: REDEMPTION_MS, minSpeechMs: 250, preSpeechPadMs: 300,
    submitUserSpeechOnPause: true,                     // pause() = « envoie ce que tu as »
    startOnLoad: false,
    getStream: async () => stream,
    pauseStream: async () => {}, resumeStream: async s => s,   // le flux est partagé avec l'enregistreur
    onFrameProcessed: p => {
      if (mode !== "auto") return;
      $("meter").firstChild.style.width = Math.round(p.isSpeech * 100) + "%";
      if (!speaking) { noise.sum += p.isSpeech; noise.n++; }
      if (noise.n >= 150) {                            // ~5 s : proba moyenne pendant le silence
        $("lat").dataset.noise = `VAD au repos : ${(noise.sum / noise.n).toFixed(2)}`; dbg($("lat").dataset.noise);
        noise = {sum: 0, n: 0}; renderLat();
      }
    },
    onSpeechStart: () => {
      if (mode !== "auto" || muted) return;            // en mode espace le VAD ne décide de rien
      dbg("VAD : début de parole ?");
      if (playing && !ducked) { ducked = true; ctx.suspend(); }   // pause tout de suite, peut-être un bruit
    },
    onVADMisfire: () => { if (mode !== "auto") return; dbg("VAD : fausse alerte"); if (ducked) { ducked = false; ctx.resume(); } },
    onSpeechRealStart: () => {
      if (mode !== "auto" || muted) return;
      dbg("VAD : parole confirmée"); speaking = true;
      bargeIn(); if (ducked) { ducked = false; ctx.resume(); }
      show("recording", "tu parles… (Envoyer pour couper)");
      clearTimeout(autoTimer);
      autoTimer = setTimeout(() => { dbg(`VAD : ${MAX_AUTO_S} s sans fin de phrase, envoi forcé`); forceEnd(); }, MAX_AUTO_S * 1000);
    },
    onSpeechEnd: audio => {
      if (mode !== "auto" || muted) { speaking = false; return; }
      speaking = false; clearTimeout(autoTimer);
      dbg("VAD : fin de parole");
      // la parole a fini ~REDEMPTION_MS avant cet événement (le VAD attend ce silence pour conclure)
      tSpeechEnd = performance.now(); vadWait = REDEMPTION_MS;
      sendSegment(audio, "VAD");
    },
  });
}
async function forceEnd() {
  if (!mic || mode !== "auto") return;
  clearTimeout(autoTimer); speaking = false;
  await mic.pause(); if (!muted) mic.start();        // pause() soumet le segment en cours
}
function renderLat() { $("lat").textContent = [$("lat").dataset.l, $("lat").dataset.noise].filter(Boolean).join(" · "); }

async function setMode(m) {
  mode = m; try { localStorage.setItem("prof-mode", m); } catch (e) {}
  $("mode").textContent = m === "espace" ? "Mode : espace" : "Mode : auto (VAD)";
  if (recording) stopRec(false);
  if (mic) { if (m === "auto" && !muted) mic.start(); else await mic.pause(); }
  dbg("mode", m);
  show(serverState === "done" ? "listening" : serverState);
}

// --- choix du micro ---
const pref = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } };
const setPref = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
function micLabel() { const t = stream && stream.getAudioTracks()[0]; return t ? t.label : ""; }
async function openMic(deviceId) {
  const filt = $("filters").checked;
  const audio = {echoCancellation: filt, noiseSuppression: filt, autoGainControl: filt, channelCount: 1};
  if (deviceId) audio.deviceId = {exact: deviceId};
  const s2 = await navigator.mediaDevices.getUserMedia({audio});
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = s2;
  const t = stream.getAudioTracks()[0], st = t.getSettings();
  $("micinfo").textContent = `🎙 ${t.label || "micro"}` + (st.sampleRate ? ` · ${st.sampleRate / 1000} kHz` : "");
  $("micinfo").title = JSON.stringify(st);
  if (/hands-free|hfp|headset|wh-1000/i.test(t.label)) $("micinfo").textContent += " (Bluetooth : bande étroite ?)";
  dbg("micro :", t.label, st);
  // liste des micros (les noms ne sont visibles qu'après autorisation)
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "audioinput");
  $("micsel").innerHTML = "";
  for (const d of devs) {
    const o = document.createElement("option"); o.value = d.deviceId; o.textContent = d.label || d.deviceId.slice(0, 8);
    if (d.deviceId === st.deviceId) o.selected = true; $("micsel").append(o);
  }
  if (rec) connectRecorder();
  if (mic) { try { mic.destroy(); } catch (e) {} mic = null; }
  try { await startVad(); } catch (e) { console.error(e); dbg("VAD indisponible", e); }
}
$("micsel").onchange = async () => { setPref("prof-mic", $("micsel").value); await openMic($("micsel").value); await setMode(mode); };
$("filters").onchange = async () => { setPref("prof-filters", $("filters").checked ? "1" : "0"); await openMic($("micsel").value || pref("prof-mic", "")); await setMode(mode); };
$("filters").checked = pref("prof-filters", "1") === "1";

// --- choix de la voix ---
let voices = [];
function fillVoices(list, cur) {
  if (list) voices = list;
  $("voicesel").innerHTML = "";
  voices.forEach((v, i) => {
    const o = document.createElement("option"); o.value = i; o.textContent = v.label;
    if (cur && v.voice === cur.voice && (v.speaker ?? null) === (cur.speaker ?? null)) o.selected = true;
    $("voicesel").append(o);
  });
  if (cur) { $("speed").value = cur.speed; $("speedv").textContent = `× ${(+cur.speed).toFixed(2)}`; }
}
function sendVoice() { const v = voices[+$("voicesel").value]; if (v) send({t: "voice", voice: v.voice, speaker: v.speaker, speed: +$("speed").value}); }
$("voicesel").onchange = sendVoice;
$("speed").oninput = () => { $("speedv").textContent = `× ${(+$("speed").value).toFixed(2)}`; };
$("speed").onchange = sendVoice;
let sampleSrc = null;
$("sample").onclick = () => { ctx.resume(); send({t: "sample"}); $("sample").textContent = "…"; };
function playSample(m) {
  $("sample").textContent = "Écouter un exemple";
  if (sampleSrc) try { sampleSrc.stop(); } catch (e) {}
  sampleSrc = ctx.createBufferSource(); sampleSrc.buffer = pcmBuffer(m.pcm, m.sr); sampleSrc.connect(out); sampleSrc.start();
}
$("gear").onclick = () => $("settings").classList.toggle("open");

$("go").onclick = async () => {
  await ctx.resume();
  try {
    await openMic(pref("prof-mic", ""));
    await startRecorder();
    await setMode(mic ? mode : "espace");
  } catch (e) { console.error(e); micErr = "micro indisponible (" + e.name + ") : écris tes questions"; $("mute").textContent = "Micro : absent"; show("listening"); }
  $("cover").remove();
  send({t: "start"});
};
$("mode").onclick = () => setMode(mode === "espace" ? "auto" : "espace");
$("send").onclick = () => mode === "espace" ? (recording ? stopRec(true) : startRec()) : forceEnd();
$("mute").onclick = () => {
  muted = !muted; $("mute").textContent = muted ? "Micro : coupé" : "Micro : ouvert";
  if (muted && recording) stopRec(false);
  if (mic && mode === "auto") muted ? mic.pause() : mic.start();
  show(serverState === "done" ? "listening" : serverState);
};
document.addEventListener("keydown", e => {
  if (e.target === $("txt") || !stream) return;
  if (e.code === "Space") {
    e.preventDefault(); if (e.repeat || muted) return;
    if (mode === "espace") recording ? stopRec(true) : startRec();
    else forceEnd();
  } else if (e.code === "Escape" && recording) stopRec(false);
});
// un clic dans le tableau (iframe) lui donne le clavier : on le reprend pour que espace marche toujours
window.addEventListener("blur", () => setTimeout(() => { if (document.activeElement === $("board")) $("board").blur(); window.focus(); }, 200));
$("txt").onkeydown = e => {
  if (e.key !== "Enter" || !$("txt").value.trim()) return;
  if (busy()) { const last = cur ? cur.text : ""; stopAll(true); gen = -1; send({t: "barge", last}); }
  tSpeechEnd = performance.now(); vadWait = 0;
  send({t: "text", text: $("txt").value.trim()}); $("txt").value = "";
};
$("test").onclick = async () => {
  // simule une prise de parole : wav 16 kHz mono -> Float32 -> serveur (comme le VAD)
  const ab = await (await fetch("/tests/question16k.wav")).arrayBuffer();
  const off = new OfflineAudioContext(1, 1, 16000);
  const buf = await off.decodeAudioData(ab);
  if (busy()) { const last = cur ? cur.text : ""; stopAll(true); gen = -1; send({t: "barge", last}); }
  const f = buf.getChannelData(0).slice();
  tSpeechEnd = performance.now(); vadWait = 0;
  send(f.buffer);
};
connect();
</script>
</body>
