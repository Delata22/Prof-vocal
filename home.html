<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whiteboard</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--fg:#1f1e1c;--muted:#6d6b65;--line:#e2e0d8;--acc:#185FA5;--accbg:#E6F1FB;--red:#E24B4A}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1a;--card:#262624;--fg:#ecebe6;--muted:#a3a19a;--line:#3a3936;--acc:#85B7EB;--accbg:#0C447C}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;min-height:100vh}
main{max-width:860px;margin:0 auto;padding:40px 24px}
header{display:flex;align-items:center;gap:14px;margin-bottom:28px}
header img{width:44px;height:44px} header h1{margin:0;font-size:28px;font-weight:600}
header .sub{color:var(--muted)}
form{display:flex;gap:10px;margin-bottom:30px;flex-wrap:wrap}
input{flex:1;min-width:260px;font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
button{font:inherit;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button:hover{filter:brightness(1.07)}
h2{font-size:15px;font-weight:500;color:var(--muted);margin:0 0 10px}
.board{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:10px 0}
.board .t{font-size:18px;font-weight:500} .board .m{color:var(--muted);font-size:14px}
.board .b{grid-row:1/3;grid-column:2}
.board.open{border-color:var(--acc)}
.empty{color:var(--muted);text-align:center;padding:30px}
#loading{display:none;position:fixed;inset:0;background:var(--bg);align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:30px}
#loading.on{display:flex} #loading .big{font-size:22px;font-weight:500}
#loading pre{max-width:820px;width:100%;white-space:pre-wrap;color:var(--muted);font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:6em}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.err{color:var(--red)}
</style>
</head>
<body>
<main>
  <header><img src="/icon.svg" alt=""><div><h1>Whiteboard</h1><div class="sub">Le prof qui t'explique au tableau, à l'oral.</div></div></header>
  <form id="new"><input id="topic" placeholder="Nouveau board : sujet (ex. « SIFT », « Filtre de Kalman »)" autocomplete="off"><button class="primary">Nouveau board</button></form>
  <h2>Tes boards</h2>
  <div id="list"><div class="empty">…</div></div>
</main>
<div id="loading"><div class="spin"></div><div class="big" id="ltitle">Je prépare le prof…</div>
  <div class="sub" style="color:var(--muted)">Chargement de la reconnaissance vocale, de la voix et de Claude (10 à 20 s).</div>
  <pre id="llog"></pre><button id="lcancel">Annuler</button></div>
<script>
const $ = id => document.getElementById(id);
function ago(t) {
  const s = Date.now() / 1000 - t;
  if (s < 90) return "à l'instant";
  if (s < 3600) return `il y a ${Math.round(s / 60)} min`;
  if (s < 86400) return `il y a ${Math.round(s / 3600)} h`;
  const d = new Date(t * 1000);
  return d.toLocaleDateString("fr-FR", {weekday: "long", day: "numeric", month: "long"});
}
async function list() {
  const j = await (await fetch("/api/boards")).json(), el = $("list");
  el.innerHTML = j.boards.length ? "" : `<div class="empty">Aucun board pour l'instant : choisis un sujet ci-dessus.</div>`;
  for (const b of j.boards) {
    const d = document.createElement("div"); d.className = "board" + (b.slug === j.open ? " open" : "");
    d.innerHTML = `<div class="t"></div><button class="b primary">Reprendre</button><div class="m"></div>`;
    d.querySelector(".t").textContent = b.title;
    d.querySelector(".m").textContent = `${b.cards} carte${b.cards > 1 ? "s" : ""} · ${ago(b.updated)}` + (b.prof ? "" : " · pas encore de séance avec le prof");
    d.querySelector("button").onclick = () => open("/api/open", {slug: b.slug}, b.title);
    el.append(d);
  }
}
let waiting = false;
async function open(api, body, title) {
  const r = await fetch(api, {method: "POST", body: JSON.stringify(body)}), j = await r.json();
  if (!r.ok) { alert(j.error || "erreur"); return; }
  $("ltitle").textContent = `Je prépare le prof : ${title}`; $("loading").classList.add("on"); waiting = true;
  const t0 = Date.now();
  while (waiting) {
    await new Promise(r => setTimeout(r, 700));
    const st = await (await fetch("/api/prof")).json();
    $("llog").textContent = st.log || "";
    if (st.slug === j.slug && st.ready) { location.href = st.url; return; }
    if (st.slug === j.slug && !st.alive && Date.now() - t0 > 2000) {
      $("ltitle").innerHTML = `<span class="err">Le prof n'a pas démarré (code ${st.code}).</span>`; waiting = false; return;
    }
  }
}
$("new").onsubmit = e => { e.preventDefault(); const t = $("topic").value.trim(); if (t) open("/api/new", {topic: t}, t); };
$("lcancel").onclick = async () => { waiting = false; await fetch("/api/stop", {method: "POST"}); $("loading").classList.remove("on"); list(); };
// retour depuis un tableau (« ← Tableaux » ou Ctrl+H) : on arrête son prof
if (new URLSearchParams(location.search).has("stop")) {
  history.replaceState(null, "", "/");
  fetch("/api/stop", {method: "POST"}).then(list);
}
list();
</script>
</body>
</html>
